[package]
name = "cakewalk"
version = "0.1.0"
edition = "2024"
authors = ["cakewalk Contributors"]
description = "A blisteringly fast, drop-in replacement for Python os.walk built with Rust, PyO3, jwalk, and SQLite."
repository = "https://github.com/vxlk/cakewalk"
homepage = "https://github.com/vxlk/cakewalk"
license = "MIT"
keywords = ["filesystem", "walk", "python", "pyo3"]
categories = ["filesystem", "api-bindings"]
readme = "README.md"

[lib]
name = "_cakewalk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossbeam-channel = "0.5"
rayon = "1.10"
xxhash-rust = { version = "0.8.10", features = ["xxh64"] }
jwalk = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

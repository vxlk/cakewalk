name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest hypothesis
        
    - name: Build and install cakewalk
      run: |
        pip install -e .
        
    - name: Run tests
      run: |
        pytest tests/

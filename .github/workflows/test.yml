name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python-version: ['3.13', '3.14', '3.14t']
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest hypothesis
        
    - name: Run rust tests
      run: |
        cargo test
        
    - name: Build and install cakewalk
      run: |
        pip install -e .
        
    - name: Run tests
      run: |
        pytest tests/

